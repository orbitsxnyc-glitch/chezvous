# PostgreSQL + PostGIS et Redis pour le développement et la CI.
# NON TESTÉ : Docker n'était pas disponible lors de l'écriture de ce fichier.
# Les ports (5433, 6380) évitent les conflits avec les services installés en natif.
# Le mot de passe doit être fourni par l'environnement (jamais dans le dépôt) :
#   CHEZVOUS_DB_PASSWORD=... docker compose -f infra/docker-compose.yml up -d
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: chezvous
      POSTGRES_USER: chezvous
      POSTGRES_PASSWORD: ${CHEZVOUS_DB_PASSWORD:?définir CHEZVOUS_DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - chezvous_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chezvous -d chezvous"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  chezvous_db:
